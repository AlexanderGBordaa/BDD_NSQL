services:
  mongo:
    image: mongo:7
    container_name: comicverse-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: comicverse-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGO_URL=mongodb://mongo:27017/comicverse
      - CORS_ORIGIN=*
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
